<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Joke Generator project </title>

  <link rel="stylesheet" href="joke-generator.css">

  <style>
    body{ 
      background-color: rgb(178, 231, 241);
    }


    .description-div{
    display: flex;
    justify-content: center;
    align-items: center;  
  }

    .description-para{
      font-family: Arial;
      font-size: 30px;
    }


    .button-div{
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 10px;
    padding: 40px 40px;
    }

    .joke-button{
      background-color: rgb(255, 255, 255);
      border:none;
      border-radius: 5px;
      font-size: 25px;
      padding: 20px 30px;
      cursor: pointer;
      border-width: 5px;
      
    }

      .joke-button:hover{
      background-color:rgb(196, 197, 198);
      border:none;
      border-radius: 5px;
      font-size: 25px;
      padding: 20px 30px;
      cursor: pointer;
      border-width: 5px;
      
    }

    .joke-para-div{
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 10px;
    padding: 20px 20px;  
    }


    .joke-p-tag{
      font-family:Arial;
      font-size:40;

    }


  
  </style>


</head>


<body>
  
 <div class="description-div">

    <p class="description-para" >
    Simple jokes to make you laugh
    </p>

  </div>

  <div class="button-div">

    <button class="js-generate-button joke-button">
    Tell me a joke
    </button>

  </div>

  <div class="joke-para-div">
    <p class="js-joke-p joke-p-tag"></p>
  </div>



  <script>

 


   document.querySelector(".js-generate-button").addEventListener('click',() => {generateJoke();})

  
   const myArray = [
 "What did the football coach say to the broken vending machine? Give me my quarterback.",
 
 "How many tickles does it take to make an octopus laugh? Ten-tickles.",
 
 "Hear about the new restaurant called Karma? There's no menu: You get what you deserve.", 
 
 "Why don't scientists trust atoms? Because they make up everything",
 
 "I try not to tell dad jokes … But when I do, he thinks they're funny.", 
 
 "What did the buffalo say when his son left for college? Bison.", 
 
 "Have you heard about the restaurant on the moon? The food is great but there's no atmosphere.",
 
 "Why don't eggs tell jokes? They might crack up!",
 
 "what's Forest Gump's password? 1forest1"

 ];

 function generateJoke(){

  let pickAJoke = Math.floor(Math.random()*(myArray.length));
  document.querySelector(".js-joke-p").innerHTML= myArray[pickAJoke];
  console.log(pickAJoke)

  //need to make sure jokes aren't repeated
 };

   
   
   
   
   
   // document.querySelector(".js-joke-p")

 </script>


</body>
</html>
