<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Calculation</title>

  <link rel="stylesheet" href="Shipping-Calculator1.css">
</head>
<body>
 <h2>Shipping Calculator</h2>

<p> Orders under £50 = £10 shipping </p>

<p> Orders over £50 = Free shipping </p>


 <input  placeholder="Cost of order" type="text" class="js-cost-input  cost-input" onkeydown=" handleCostKeydown (event)"> 

   <button class="calculate-button"    onclick="
  calculateTotal();"> Calculate</button>

<p class="js-total-cost">Cost</p> 

<script>


function costKeydown(event){

if (event.key === 'Enter') {calculateTotal();
  } 

}


function calculateTotal(){


  const inputElement = document.querySelector('.js-cost-input');

  
  let cost = Number(inputElement.value); 
  
  // when we get a value from the dom it's a string and if we want to turn it into a number we have to use the function Number()
  console.log(cost)

  
  if (cost < 40){cost = cost + 10;};
 // console.log(cost)

  document.querySelector('.js-total-cost').innerHTML = `£${cost}`;

}

</script>


</body>
</html>
